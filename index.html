<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Dibujante Técnico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Evaluación Dibujante Técnico Mecánico</h1>
    <div id="start-screen">
      <button id="start-btn">Iniciar Evaluación</button>
    </div>
    <div id="quiz-container" style="display:none;">
      <div id="progress-bar">
        <div id="progress"></div>
      </div>
      <div id="timer">Tiempo restante: <span id="time-left">30:00</span></div>

      <div id="question-container">
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
        <button id="next-btn">Siguiente</button>
      </div>

      <div id="result-container" style="display:none;">
        <h2>Resultado Final</h2>
        <p id="score-text"></p>
        <p id="status-text"></p>
        <div id="answers-review">
          <h3>Resumen de respuestas:</h3>
          <ul id="review-list"></ul>
        </div>
        <button id="restart-btn">Reiniciar Evaluación</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
