<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Evaluación Técnica</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
    }
    .logo {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 50px; /* Ajusta el tamaño del logo */
      height: auto;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-top: 60px; /* Espacio para que no se solape con el logo */
    }
    nav ul {
      list-style: none;
      padding: 0;
    }
    nav li {
      margin: 10px 0;
    }
    nav a {
      display: block;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      text-align: center;
    }
    nav a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo" class="logo"> <!-- Asegúrate de tener logo.png en la raíz -->
    <h1>Centro de Evaluación Técnica</h1>
    <nav>
      <ul>
        <li><a href="evaluacion.html">Plantilla de Evaluación Práctica</a></li>
        <li><a href="entrevista.html">Entrevista Técnica</a></li>
        <li><a href="cuestionario.html">Evaluación Web (Online)</a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
